[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-drug-discovery"
version = "1.0.0"
description = "End-to-end computational pipeline for small-molecule analysis and preliminary drug candidate prioritisation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9.1",
    "biopython>=1.81",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
